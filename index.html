<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="manifest" href="./manifest.json">
    <title>Shenyin</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand__dot"></div>
        <div class="brand__text">
          <div class="brand__title"> 声音 </div>
          <div class="brand__subtitle">IndexedDB · Vanilla JS · Dark mode</div>
        </div>
      </div>
      <div class="topbar__actions">
        <button id="btnNewPlaylist" class="btn btn--primary">➕ New playlist</button>
        <label class="btn" for="importPlaylistInput">📥 Import playlist</label>
        <input id="importPlaylistInput" type="file" accept=".json" hidden />
      </div>
    </header>

    <main class="layout">
      <!-- Left / top panel: playlist list -->
      <section class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Playlists</h2>
        </div>
        <div class="panel__body">
          <div id="playlistList" class="list list--playlists"></div>
        </div>
      </section>

      <!-- Right / bottom panel: track list + controls -->
      <section class="panel">
        <div class="panel__header panel__header--stack">
          <div class="row row--space">
            <h2 class="panel__title">Tracks</h2>
            <div class="badge" id="activePlaylistBadge">No playlist</div>
          </div>

          <div class="row row--wrap">
            <label class="btn btn--ghost" for="fileInput">📁 Add media</label>
            <!-- Accept any audio or video the browser can attempt to play -->
            <input id="fileInput" type="file" accept="audio/*,video/*" multiple hidden />
            <button id="btnPlay"    class="btn btn--primary" disabled>▶️ Play</button>
            <button id="btnPrev"    class="btn" disabled>⏮ Prev</button>
            <button id="btnNext"    class="btn" disabled>Next ⏭</button>
            <button id="btnShuffle" class="btn" disabled>🔀 Random</button>
          </div>

          <!-- Seek bar + time display -->
          <div class="seek-row">
            <input type="range" id="seekBar" class="seekbar"
                   min="0" max="1000" value="0" step="1" disabled />
            <span id="timeDisplay" class="time-display">—</span>
          </div>

          <div class="row row--space">
            <div class="mini" id="nowPlaying">—</div>
            <div class="mini mini--muted" id="storageInfo">—</div>
          </div>
        </div>

        <div class="panel__body">
          <!-- Video element — hidden for audio, shown for video content -->
          <video id="mediaEl" preload="metadata" class="media-player" playsinline></video>

          <div id="trackList" class="list list--tracks"></div>
          <div class="empty" id="emptyState">Select a playlist then add media files.</div>
        </div>
      </section>
    </main>

    <script src="./styles.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
